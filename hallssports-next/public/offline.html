<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HallsSports – Offline</title>
  <style>
    body {
      margin: 0;
      background: #0F0F0F;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 3rem;
      text-align: center;
      max-width: 400px;
      margin: 1rem;
    }
    h1 {
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: rgba(255,255,255,0.7);
      margin-bottom: 2rem;
    }
    .btn {
      background: #00A859;
      color: #fff;
      padding: 0.75rem 2rem;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚽ You're Offline</h1>
    <p>Live updates are paused. The app will refresh when your connection returns.</p>
    <a href="/" class="btn">Try Again</a>
  </div>
</body>
</html>
